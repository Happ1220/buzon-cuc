<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón CUC Escucha</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container">
    <h1>Buzón CUC Escucha</h1>
    <p>Comparte tus ideas para mejorar la Universidad.</p>

    <form>
        <label>Nombre</label>
        <input type="text" required>

        <label>Correo</label>
<input type="email" required>

<label>Programa Académico</label>
<input type="text" placeholder="Ej. Ingeniería de Sistemas" required>

<label>Categoría</label>
<select required>
    <option value="">Selecciona una categoría</option>
    <option value="academica">Académica</option>
    <option value="infraestructura">Infraestructura</option>
    <option value="bienestar">Bienestar estudiantil</option>
    <option value="tecnologia">Tecnología</option>
    <option value="servicios">Servicios universitarios</option>
    <option value="otra">Otra</option>
</select>

<label>Sugerencia</label>
<textarea required></textarea>

        <button type="submit">Enviar</button>
    </form>
</div>

<script src="js/script.js"></script>

</body>
</html>
